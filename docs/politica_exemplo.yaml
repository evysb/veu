  ignorar_maiusculas: false
- nome: Número de prontuário
  regex: PRONT-\d{5,8}
  id: NUMERO_DE_PRONTUARIO
  rotulo: '[NÚMERO DE PRONTUÁRIO]'
  cor: '#6A1B9A'
  ativo: true
  ignorar_maiusculas: true
