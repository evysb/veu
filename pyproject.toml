[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veu"
version = "0.1.0"
description = "Véu — anonimizador de PDF 100% offline"
requires-python = ">=3.11"
dependencies = [
    # 1.28.2: as versões 2.0 e 2.1 deslocam o texto restante após a redação (ver tests/test_regressao_pymupdf.py)
    "pymupdf==1.28.2",
    "PySide6>=6.6",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "spacy>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.gui-scripts]
veu = "veu.ui.app:main"

[project.scripts]
anonimizar = "veu.cli:main"

[tool.setuptools.packages.find]
include = ["veu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
veu = ["recursos/*.txt"]
